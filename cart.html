<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Meta tags -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Page title and stylesheet -->
  <title>Cart | AIU Club Store</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <a class="brand" href="index.html">AIU CLUB STORE</a>
    <div class="nav-links">
      <a href="shop.html">Merchandise</a>
      <a href="events.html">Events</a>
      <a href="cart.html">Cart (1)</a>
    </div>
  </nav>

  <!-- Main Content: Shopping Cart -->
  <main class="container section">
    <h2>Your Cart</h2>

    <!-- Cart Table -->
    <table class="table">
      <thead>
        <tr>
          <th>Item</th>
          <th>Type</th>
          <th>Quantity</th>
          <th>Price</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Sports Club T-Shirt</td>
          <td>Merchandise</td>
          <td>1</td>
          <td>KES 1,200</td>
        </tr>
      </tbody>
    </table>

    <!-- Cart Total -->
    <p class="total">Total: KES 1,200</p>

    <!-- Checkout Action -->
    <p style="text-align:right">
      <a class="button" href="#">Proceed to Checkout</a>
    </p>
  </main>

  <!-- Footer -->
  <footer class="footer">
    © 2026 AIU Student Club Store
  </footer>

</body>
</html>
